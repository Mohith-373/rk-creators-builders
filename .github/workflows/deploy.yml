name: Deploy to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install function dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund @netlify/blobs@^8.1.0 nodemailer@^6.9.15

      - name: Deploy to Netlify
        run: npx netlify-cli@17.0.0 deploy --prod --dir . --message "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}